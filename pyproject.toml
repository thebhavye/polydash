[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polydash"
version = "0.1.0"
description = "Source-aware dashboard configuration validation and static HTML preview"
requires-python = ">=3.10"

[project.optional-dependencies]
yaml = ["PyYAML>=6.0.3,<7"]

[tool.setuptools]
packages = ["polydash"]
